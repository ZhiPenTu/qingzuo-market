name: Verify plugin releases
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Registered plugin repository; blank checks all publishers'
        required: false
        type: string
      tag:
        description: 'Stable version tag; blank selects latest stable release'
        required: false
        type: string
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: market-catalog-write
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test && npm run validate
      - name: Verify registered releases
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_REPOSITORY: ${{ inputs.repository }}
          PLUGIN_TAG: ${{ inputs.tag }}
        run: npm run verify:release
